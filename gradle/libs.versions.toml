# Gradle Version Catalog for UAA

[versions]
bouncyCastleFips = "2.1.2"
bouncyCastlePkix = "2.1.12"
bouncyCastleTls = "2.1.24"
bouncyCastleUtil = "2.1.7"
brave = "6.3.1"
commonsCodec = "1.22.0"
commonsIo = "2.22.0"
# Pin cryptacular for the OpenSAML 5.2.x upgrade to maintain compatibility with our FIPS dependency set.
cryptacular = "1.2.6"
eclipseJgit = "7.7.0.202606012155-r"
greenmail = "2.1.11"
guava = "33.6.0-jre"
jacoco = "4.0.2"
jacocoAgent = "0.8.15"
nimbusJwt = "10.9.1"
opensaml = "5.2.3"
orgJson = "20260522"
passay = "2.0.0"
selenium = "4.46.0"
sonarqube = "7.3.1.8318"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
springDocOpenapi = "3.0.3"
statsdClient = "4.4.5"
tomcat = "11.0.24"
scim2Sdk = "6.0.0"
velocity = "2.4.1"
xmlSecurity = "4.0.4"

[libraries]
# Apache Commons
commonsCodec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
commonsIo = { module = "commons-io:commons-io", version.ref = "commonsIo" }

# Apache Directory Server
apacheHttpClient = { module = "org.apache.httpcomponents.client5:httpclient5" }
apacheLdapApi = "org.apache.directory.api:api-ldap-model:2.1.8"

# Apache Logging
log4jCore = { module = "org.apache.logging.log4j:log4j-core" }
slf4jImpl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl" }

# Apache Tomcat
tomcatElApi = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcatEmbed = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcatJasperEl = { module = "org.apache.tomcat.embed:tomcat-embed-jasper", version.ref = "tomcat" }
tomcatJdbc = { module = "org.apache.tomcat:tomcat-jdbc", version.ref = "tomcat" }

# Apache Velocity
velocity = { module = "org.apache.velocity:velocity-engine-core", version.ref = "velocity" }

# Apache XML Security
xmlSecurity = { module = "org.apache.santuario:xmlsec", version.ref = "xmlSecurity" }

# AspectJ
aspectJWeaver = { module = "org.aspectj:aspectjweaver" }

# Awaitility
awaitility = { module = "org.awaitility:awaitility" }

# BouncyCastle FIPS
bouncyCastleFipsProv = { module = "org.bouncycastle:bc-fips", version.ref = "bouncyCastleFips" }
bouncyCastlePkixFips = { module = "org.bouncycastle:bcpkix-fips", version.ref = "bouncyCastlePkix" }
bouncyCastleTlsFips = { module = "org.bouncycastle:bctls-fips", version.ref = "bouncyCastleTls" }
bouncyCastleUtilFips = { module = "org.bouncycastle:bcutil-fips", version.ref = "bouncyCastleUtil" }

# Eclipse JGit
eclipseJgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "eclipseJgit" }

# FasterXML Jackson
jacksonAnnotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jacksonDatabind = { module = "tools.jackson.core:jackson-databind" }

# Flyway
flywayCore = { module = "org.flywaydb:flyway-core" }
flywayHsqlDb = { module = "org.flywaydb:flyway-database-hsqldb" }
flywayMySql = { module = "org.flywaydb:flyway-mysql" }
flywayPostgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Google Guava
guava = { module = "com.google.guava:guava", version.ref = "guava" }

# Greenmail
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }

# Hibernate
hibernateValidator = { module = "org.hibernate.validator:hibernate-validator" }

# HSQLDB
hsqldb = { module = "org.hsqldb:hsqldb" }

# JaCoCo
jacocoAgent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacocoAgent" }

# Jakarta
jakartaValidationApi = { module = "jakarta.validation:jakarta.validation-api" }

# JSON Processing
jsonPath = { module = "com.jayway.jsonpath:json-path" }
orgJson = { module = "org.json:json", version.ref = "orgJson" }

# JUnit 5
junit5JupiterApi = { module = "org.junit.jupiter:junit-jupiter-api" }
junit5JupiterEngine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit5JupiterParams = { module = "org.junit.jupiter:junit-jupiter-params" }
junit5PlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

# Lombok
lombok = { module = "org.projectlombok:lombok" }

# MariaDB
mariaJdbcDriver = { module = "org.mariadb.jdbc:mariadb-java-client" }

# Mockito
mockitoJunit5 = { module = "org.mockito:mockito-junit-jupiter" }

# Nimbus JOSE+JWT
nimbusJwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJwt" }

# OpenSAML
openSamlApi = { module = "org.opensaml:opensaml-saml-api", version.ref = "opensaml" }

# Passay
passay = { module = "org.passay:passay", version.ref = "passay" }

# PostgreSQL
postgresql = { module = "org.postgresql:postgresql" }

# Selenium
selenium = { module = "org.seleniumhq.selenium:selenium-java", version.ref = "selenium" }
seleniumRemoteDriver = { module = "org.seleniumhq.selenium:selenium-remote-driver", version.ref = "selenium" }
seleniumHttp = { module = "org.seleniumhq.selenium:selenium-http", version.ref = "selenium" }

# SLF4J
slf4jApi = { module = "org.slf4j:slf4j-api" }

# SnakeYAML
snakeyaml = { module = "org.yaml:snakeyaml" }

# Spring Framework
springBeans = { module = "org.springframework:spring-beans" }
springContext = { module = "org.springframework:spring-context" }
springContextSupport = { module = "org.springframework:spring-context-support" }
springJdbc = { module = "org.springframework:spring-jdbc" }
springTest = { module = "org.springframework:spring-test" }
springTx = { module = "org.springframework:spring-tx" }
springWeb = { module = "org.springframework:spring-web" }
springWebMvc = { module = "org.springframework:spring-webmvc" }

# Spring Boot
springBootBom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
springBootFlyway = { module = "org.springframework.boot:spring-boot-flyway" }
springBootJdbc = { module = "org.springframework.boot:spring-boot-jdbc" }
springBootSql = { module = "org.springframework.boot:spring-boot-sql" }
springBootStarter = { module = "org.springframework.boot:spring-boot-starter" }
springBootStarterLog4j2 = { module = "org.springframework.boot:spring-boot-starter-log4j2" }
springBootStarterMail = { module = "org.springframework.boot:spring-boot-starter-mail" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test" }
springBootStarterTomcatRuntime = { module = "org.springframework.boot:spring-boot-starter-tomcat-runtime" }
springBootStarterWeb = { module = "org.springframework.boot:spring-boot-starter-web" }
springBootTransaction = { module = "org.springframework.boot:spring-boot-transaction" }

# Spring Data
springLdapCore = { module = "org.springframework.ldap:spring-ldap-core" }

# Spring Doc
springDocOpenapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springDocOpenapi" }

# Spring REST Docs
springRestdocs = { module = "org.springframework.restdocs:spring-restdocs-mockmvc" }

# Spring Security
springSecurityAccess = { module = "org.springframework.security:spring-security-access" }
springSecurityConfig = { module = "org.springframework.security:spring-security-config" }
springSecurityCore = { module = "org.springframework.security:spring-security-core" }
springSecurityLdap = { module = "org.springframework.security:spring-security-ldap" }
springSecuritySamlServiceProvider = { module = "org.springframework.security:spring-security-saml2-service-provider" }
springSecurityTest = { module = "org.springframework.security:spring-security-test" }
springSecurityWeb = { module = "org.springframework.security:spring-security-web" }

# Spring Session
springSessionJdbc = { module = "org.springframework.session:spring-session-jdbc" }

# StatsD
statsdClient = { module = "com.datadoghq:java-dogstatsd-client", version.ref = "statsdClient" }

# Thymeleaf
thymeLeaf = { module = "org.thymeleaf:thymeleaf" }
thymeleafDialect = { module = "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect" }
thymeleafExtrasSpringSecurity = { module = "org.thymeleaf.extras:thymeleaf-extras-springsecurity6" }
thymeleafSpring = { module = "org.thymeleaf:thymeleaf-spring6" }

# UnboundID
unboundIdLdapSdk = { module = "com.unboundid:unboundid-ldapsdk" }
scim2SdkCommon = { module = "com.unboundid.product.scim2:scim2-sdk-common", version.ref = "scim2Sdk" }

# XMLUnit
xmlUnit = { module = "org.xmlunit:xmlunit-assertj" }

# Zipkin Brave
braveContextSlf4j = { module = "io.zipkin.brave:brave-context-slf4j", version.ref = "brave" }
braveInstrumentation = { module = "io.zipkin.brave:brave-instrumentation-servlet-jakarta", version.ref = "brave" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
jacocoLog = { id = "org.barfuin.gradle.jacocolog", version.ref = "jacoco" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
