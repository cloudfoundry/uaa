name: labeler

# pull_request_target is required so PRs from forks get a token that can write labels.
# This is safe only because the job never checks out or executes code from the PR;
# the labeler reads the PR size through the GitHub API. Do not add a checkout step here.
on: [pull_request_target]

jobs:
  labeler:
    runs-on: ubuntu-latest
    name: Label the PR size
    permissions:
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@v1.11.1
        with:
          xs_label: 'size/xs'
          xs_max_size: '10'
          s_label: 'size/s'
          s_max_size: '100'
          m_label: 'size/m'
          m_max_size: '500'
          l_label: 'size/l'
          l_max_size: '1000'
          xl_label: 'size/xl'
          fail_if_xl: 'false'
          message_if_xl: >
            This PR exceeds the recommended size of 1000 lines.
            Please make sure you are NOT addressing multiple issues with one PR.
            Note this PR might be rejected due to its size.
          files_to_ignore: ''
