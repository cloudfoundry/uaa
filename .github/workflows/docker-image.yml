name: Docker Image CI

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'liberica'
          java-version: '21'
          check-latest: false
          cache: 'gradle'
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Git command
        run: |
         bash -c "git tag"
         bash -c "git tag | sort --version-sort | tail -n1 |cut -c2-"
      - name: Build the Docker image   
        run:
         export BP_JVM_TYPE=JDK && ./gradlew --no-daemon --max-workers 1 bootBuildImage --imageName docker.io/strehle/uaa:${{ github.run_number }} --publishImage
