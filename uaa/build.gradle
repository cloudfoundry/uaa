ext {
    snippetsDir = file("build/generated-snippets")
}

test {
    exclude("org/cloudfoundry/identity/uaa/integration/*.class")
    exclude("**/*IT.class")
    exclude("**/*Docs.class")
    systemProperty("mock.suite.test", "true")

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Running tests in parallel
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~

    // Count available cores. We assume 2 logical cores per physical core.
    // In case there is only one vCPU, we count 1 full core.
    var availableCpus = Math.max(Runtime.getRuntime().availableProcessors() / 2, 1.0)

    // We want some amount of parallelism, but it does not make sense to run too many
    // tests in parallel, see docs/testing. We target 4 tests in parallel at most. If
    // there are less CPUs available, we use all available CPUs but no more.
    maxParallelForks = Math.min(availableCpus, 4)
}

tasks.register("populateVersionfile") {
    def versionFile = new File("$projectDir/slateCustomizations/source/versionfile")
    versionFile.createNewFile()
    assert versionFile.exists()
    versionFile.text = version.toString().substring(0, version.toString().lastIndexOf(".")) + ".0"
}
tasks.register( "customizeSlate", Copy) {
    dependsOn(tasks.named('populateVersionfile'))
    from("slate")
    from("slateCustomizations")
    into("build/slate")
}
tasks.register("docsTestRestDocs", Test) {
    dependsOn(tasks.named('testClasses'))
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include("**/*Docs.class")
    systemProperty("docs.build.generated.snippets.dir", snippetsDir.getPath())
}

tasks.register("gemInstallBundle", Exec) {
    dependsOn("customizeSlate")
    workingDir(file("build/slate"))
    executable("gem")
    args("install", "bundler:2.7.1")
}

tasks.register("bundleInstall", Exec) {
    dependsOn(tasks.named('gemInstallBundle'))
    dependsOn("customizeSlate")
    workingDir(file("build/slate"))
    executable("bundle")
    args("install")
}

tasks.register("deleteDefaultContent", Delete) {
    delete("build/slate/source/index.html.md")
}

tasks.register("slate", Exec) {
    dependsOn("customizeSlate", "deleteDefaultContent", "bundleInstall", "docsTestRestDocs")
    workingDir(file("build/slate"))
    executable("bundle")
    args("exec", "middleman", "build", "--verbose", "--build-dir=../docs/version/" + version.toString().substring(0, version.toString().lastIndexOf(".")) + ".0")
}

generateDocs {
    dependsOn(slate)
}

// Gradle bootBuildImage task configuration
tasks.named('bootBuildImage') {
    imageName = "cloudfoundry/uaa:${version}"
    boolean doDebug = false
    def activeSpringProfiles = (System.getProperty('spring.profiles.active', '')?.split(',') ?: []) as List<String>
    if (activeSpringProfiles.contains("debugs") || Boolean.valueOf(System.getProperty("xdebugs")) ||
        activeSpringProfiles.contains("debug") || Boolean.valueOf(System.getProperty("xdebug"))) {
        doDebug = true
    }
    // https://github.com/paketo-buildpacks/bellsoft-liberica
    // use JRE since JDK gets too big
    environment.putAll([
            'BP_SPRING_CLOUD_BINDINGS_DISABLED': 'true',
            'BP_JVM_VERSION'                   : '25',
            'BP_JVM_TYPE'                      : System.getenv('BP_JVM_TYPE') ?: project.findProperty('BP_JVM_TYPE') ?: 'JRE',
            'BP_JVM_PLATFORM'                  : 'liberica'
    ])
    if (doDebug) {
        environment.put("BPL_DEBUG_ENABLED", "true")
        environment.put("BPL_DEBUG_PORT", "5005")
    }
}

integrationTest {
    // Use the test source set and classpath
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    
    filter {
        includeTestsMatching("org.cloudfoundry.identity.uaa.integration.*")
        includeTestsMatching("*IT")
    }
    String samlUrlPropKey = "integration.test.saml.url"
    String samlUrl = System.getProperty(samlUrlPropKey)
    if (samlUrl?.trim()) {
        systemProperty("integration.test.saml.url", samlUrl)
        project.logger.warn("UAA - Overriding SAML Url:"+samlUrl)
    }

    def useExternalIntegrationServer = {
        def v = rootProject.findProperty('uaaIntegrationServer') ?: findProperty('uaaIntegrationServer') ?: System.getenv('UAA_INTEGRATION_SERVER')
        v != null && v.toString().equalsIgnoreCase('external')
    }

    doFirst {
        if (useExternalIntegrationServer()) {
            logger.lifecycle("UAA_INTEGRATION_SERVER=external (or -PuaaIntegrationServer=external): skipping embedded java -jar; tests expect UAA on port 8080")
            return
        }
        logger.lifecycle("Killing UAA before auto-start")
        rootProject.tasks.named('killUaa').get().exec()

        def bootPidFile = rootProject.file('build/boot.pid')
        def bootLogFile = rootProject.file('build/boot.log')
        def springProfile = System.getProperty("spring.profiles.active", "hsqldb")
        def warFile = file("build/libs/cloudfoundry-identity-uaa-0.0.0.war")
        def bootDir = rootProject.file("scripts/boot")

        logger.lifecycle("Starting UAA application for integration tests...")

        def javaCmd = """nohup java \\
            -DCLOUDFOUNDRY_CONFIG_PATH=${bootDir.absolutePath} \\
            -DSECRETS_DIR=${bootDir.absolutePath} \\
            -Dserver.servlet.context-path=/uaa \\
            -Dsmtp.host=localhost \\
            -Dsmtp.port=2525 \\
            -Dspring.profiles.active=${springProfile} \\
            -jar ${warFile.absolutePath} > ${bootLogFile.absolutePath} 2>&1 & echo \$!"""

        def proc = ['bash', '-c', javaCmd].execute()
        proc.waitFor()
        def pid = proc.text.trim()
        bootPidFile.text = pid

        logger.lifecycle("UAA started with PID: ${pid}, waiting for it to be ready...")

        def maxWaitSeconds = 300
        def startTime = System.currentTimeMillis()
        while (System.currentTimeMillis() - startTime < maxWaitSeconds * 1000) {
            if (bootLogFile.exists() && bootLogFile.text.contains("Started UaaBootApplication")) {
                logger.lifecycle("UAA is ready!")
                return
            }
            Thread.sleep(1000)
        }

        logger.lifecycle("Killing UAA after failed auto-start")
        rootProject.tasks.named('killUaa').get().exec()
        throw new GradleException("UAA failed to start within ${maxWaitSeconds} seconds. Check ${bootLogFile.absolutePath}")
    }

    doLast {
        if (useExternalIntegrationServer()) {
            logger.lifecycle("Skipping embedded UAA shutdown; external Tomcat lifecycle is managed by the caller")
            return
        }
        logger.lifecycle("Stopping UAA application...")
        rootProject.tasks.named('killUaa').get().exec()
        rootProject.file('build/boot.pid').delete()
    }
    
    dependsOn bootWar
}

bootRun {
    dependsOn rootProject.cleanBootTomcatDir
    mainClass = "org.cloudfoundry.experimental.boot.UaaBootApplication"
    systemProperty("logging.level.org.springframework.security", "TRACE")
    systemProperty("logging.config", file("../scripts/boot/log4j2.properties").getAbsolutePath())
    systemProperty("uaa.boot.location.tomcat", System.getProperty("uaa.boot.location.tomcat", file("../scripts/boot/tomcat").getAbsolutePath()))
    systemProperty("spring.profiles.active", System.getProperty("spring.profiles.active", "hsqldb"))
    systemProperty("metrics.perRequestMetrics", System.getProperty("metrics.perRequestMetrics", "true"))
    systemProperty("smtp.host", "localhost")
    systemProperty("smtp.port", 2525)
    systemProperty("java.security.egd", "file:/dev/./urandom")
    systemProperty("CLOUDFOUNDRY_CONFIG_PATH", file("../scripts/boot").getAbsolutePath())
    systemProperty("server.servlet.context-path", "/uaa")
    systemProperty("statsd.enabled", "true")

    // Enable debug mode if -Pdebug or -Pdebugs flag is provided
    if (project.hasProperty('debug') || project.hasProperty('debugs')) {
        def debugPort = project.findProperty('debugPort') ?: '5005'
        // debugs = suspend and wait for debugger, debug = start immediately
        def suspend = project.hasProperty('debugs') ? 'y' : 'n'
        jvmArgs += [
                "-agentlib:jdwp=transport=dt_socket,server=y,suspend=${suspend},address=*:${debugPort}"
        ]
        def mode = suspend == 'y' ? 'Suspended debug' : 'Debug'
        logger.lifecycle("${mode} mode enabled. Listening on port ${debugPort}")
    }
}